name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK；接受许可并补齐所需组件
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # 核心算法包：测试
      - run: dart pub get
        working-directory: packages/simple_guard_dart
      - run: dart test
        working-directory: packages/simple_guard_dart

      # App：依赖 / 静态分析 / 测试
      - run: flutter pub get
        working-directory: apps/camera_guard
      - run: flutter analyze
        working-directory: apps/camera_guard
      - run: flutter test
        working-directory: apps/camera_guard

      # 演示 keystore 随仓库提交；正式项目请改用 CI secrets
      - run: |
          echo "storePassword=videoguard-demo-2026" > key.properties
          echo "keyPassword=videoguard-demo-2026" >> key.properties
          echo "keyAlias=videoguard" >> key.properties
          echo "storeFile=../keystore/videoguard-release.jks" >> key.properties
        working-directory: apps/camera_guard/android

      - run: flutter build apk --release
        working-directory: apps/camera_guard

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: apps/camera_guard/build/app/outputs/flutter-apk/app-release.apk
